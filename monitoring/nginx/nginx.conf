events {}

http {
    upstream spring_boot_apps {
        server app-1:8080;
        server app-2:8080;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://spring_boot_apps;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
